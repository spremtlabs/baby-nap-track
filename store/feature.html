<!doctype html>
<!-- Play's feature graphic, 1024 by 500. node store/feature.mjs writes store/assets/feature-1024x500.png from it. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: Figtree; font-weight: 400; src: url(../node_modules/@expo-google-fonts/figtree/400Regular/Figtree_400Regular.ttf) }
  @font-face { font-family: Figtree; font-weight: 700; src: url(../node_modules/@expo-google-fonts/figtree/700Bold/Figtree_700Bold.ttf) }
  html, body { margin: 0; width: 1024px; height: 500px; background: #0E1222; overflow: hidden }
  svg { position: absolute; left: 0; top: 0 }
  .words { position: absolute; left: 442px; top: 0; height: 500px; display: flex; flex-direction: column; justify-content: center; font-family: Figtree }
  h1 { margin: 0 0 22px; font-size: 76px; font-weight: 700; line-height: 1; color: #ECE6D9; white-space: nowrap; letter-spacing: -0.5px }
  p { margin: 0; font-size: 36px; line-height: 1.3; color: #9398B0 }
</style>
<svg width="420" height="500" viewBox="0 0 420 500">
  <mask id="cut"><rect width="420" height="500" fill="#fff"/><circle cx="291.9" cy="204.6" r="129.2" fill="#000"/></mask>
  <circle cx="230.1" cy="249.6" r="149.8" fill="#F2B868" mask="url(#cut)"/>
</svg>
<div class="words">
  <h1>Baby Nap Track</h1>
  <p>When to put your baby<br>down for the next nap</p>
</div>
